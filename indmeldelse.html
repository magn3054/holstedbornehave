<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holsted Børnehave</title>
    <link rel="stylesheet" href="css/overall-styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <script src="js/navbar.js" defer></script>
    <script src="js/toast.js" defer></script>
</head>

<body>
    <header>
        <img src="img/hb-logo.svg" alt="logo" onclick="toggleNav('logo')">
        <nav>
            <ul id="sidemenu">
                <li>
                    <div class="svg-button" onclick="window.location.href='index.html'">
                        <img src="img/headerblob1.svg" alt="">
                        <h2>Hjem</h2>
                    </div>
                </li>
                <li>
                    <div class="svg-button" onclick="window.location.href='hvem-er-vi.html'">
                        <img src="img/headerblob2.svg" alt="">
                        <h2>Hvem er vi?</h2>
                    </div>
                </li>
                <li>
                    <div class="svg-button" onclick="window.location.href='hverdagen.html'">
                        <img src="img/headerblob3.svg" alt="">
                        <h2>Hverdagen</h2>
                    </div>
                </li>
                <li>
                    <div class="svg-button" onclick="toggleNav()">
                        <img src="img/headerblob4.svg" alt="">
                        <h2>Kontakt</h2>
                    </div>
                </li>
            </ul>
            <div id="burger" onclick="toggleNav()">
                <img src="img/green-burger.svg" alt="">
                <img src="img/yellow-burger.svg" alt="">
                <img src="img/green-burger.svg" alt="">
            </div>
        </nav>
    </header>

    <main>
        <form>
            <h1>Indmeldelse</h1>
            <label for="navn">Barnets navn</label>
            <input type="text" id="navn" name="navn" required>

            <label for="fodt">Barnets fødselsdato</label>
            <input type="date" id="fodt" name="fodt" required>

            <label for="email">Forældres mail</label>
            <input type="email" id="email" name="email" required>

            <label for="startdato">Ønsket startdato</label>
            <input type="date" id="startdato" name="startdato" required>

            <div class="knapper"><button type="submit">Send</button></div>
        </form>
    </main>

    <footer>
        <section>
            <div class="footer-bubble"><a
                    href="https://www.google.com/maps/place/H%C3%B8jmarksvej+22,+6670+Holsted/@55.4974315,8.9092582,641m/data=!3m2!1e3!4b1!4m6!3m5!1s0x464b406d9dfbc0a3:0x508580d6dd4f670b!8m2!3d55.4974286!4d8.9141291!16s%2Fg%2F11c58550yg?entry=ttu&g_ep=EgoyMDI1MDUxNS4wIKXMDSoASAFQAw%3D%3D"
                    target="_blank">Højmarksvej 22</a></div>
            <div class="footer-bubble"><a href="tel:75392304">75 39 23 04</a></div>
            <div class="footer-bubble"><a href="mailto: post@holstedbornehave.dk">post@holstedbornehave.dk</a></div>
        </section>
    </footer>

</body>

</html>
